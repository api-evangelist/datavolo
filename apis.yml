name: Datavolo
description: >-
  Datavolo is a dataflow infrastructure company building multimodal data
  pipelines for generative AI and unstructured data, powered by Apache NiFi.
  Founded by the original creators of Apache NiFi, Datavolo delivers fast,
  horizontally scalable pipelines that can be instantly reconfigured, with
  built-in data lineage, for AI/ML and data engineering teams working with
  documents, images, audio, and other unstructured sources. Datavolo was
  acquired by Snowflake in November 2024 and its technology continues under
  the Snowflake data platform. The company operates a hosted cloud service
  (cloud.datavolo.ai / app.datavolo.ai), a documentation site, a developer
  DevCenter of tutorials, and open-source tooling for the Apache NiFi
  ecosystem published under the datavolo-io GitHub organization.
